<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo-Brutalism 雲端個人化待辦清單</title>
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #ffffff;
      --border-color: #000000;
      --shadow-hard: 5px 5px 0px #000000;
      --shadow-hard-sm: 3px 3px 0px #000000;
      --shadow-hard-lg: 8px 8px 0px #000000;
      
      --accent-yellow: #fde047;
      --accent-pink: #f43f5e;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --accent-blue: #38bdf8;
      
      --text-main: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; color: var(--text-main); }

    .neo-card { width: 100%; max-width: 620px; background: var(--card-bg); border: 3px solid var(--border-color); box-shadow: var(--shadow-hard-lg); border-radius: 16px; padding: 28px; position: relative; }

    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .title-box { background: var(--accent-yellow); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 6px 14px; border-radius: 8px; transform: rotate(-1deg); }
    .title-box h1 { font-size: 20px; font-weight: 900; }

    /* 登入相關 UI */
    .auth-section { display: flex; align-items: center; gap: 10px; }
    .btn-login { background: var(--accent-yellow); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 8px 14px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .btn-login:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
    .user-profile { display: none; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--border-color); padding: 4px 10px; border-radius: 20px; box-shadow: 2px 2px 0px #000; }
    .user-profile img { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #000; }
    .user-profile span { font-weight: 800; font-size: 12px; }
    .btn-logout { background: var(--accent-pink); color: #fff; border: 1.5px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; cursor: pointer; }

    /* 進度條 */
    .progress-box { background: #ffffff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 12px; margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 6px; }
    .progress-track { height: 16px; background: #f1f5f9; border: 2px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-green); transition: width 0.3s ease; }

    /* 搜尋與標籤 */
    .search-pill { display: flex; align-items: center; background: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 8px 12px; margin-bottom: 20px; }
    .search-pill input { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 700; margin-left: 8px; background: transparent; }
    .tab-group { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .neo-tab { background: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .neo-tab.active { background: var(--accent-purple); color: #fff; }

    /* 輸入區 */
    .input-box { background: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard); border-radius: 12px; padding: 14px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
    .neo-input { border: 2px solid var(--border-color); padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; outline: none; }
    .input-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .neo-select, .neo-date { border: 2px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; background: #fff; outline: none; cursor: pointer; }
    .btn-add { margin-left: auto; background: var(--accent-pink); color: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 8px 18px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .btn-add:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

    /* 列表清單 */
    .todo-list { list-style: none; display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
    .todo-item { background: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .todo-item.completed { background: #f8fafc; opacity: 0.7; }
    .todo-item.completed .todo-title { text-decoration: line-through; }
    .todo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .todo-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .neo-cb { width: 18px; height: 18px; accent-color: #000; cursor: pointer; }
    .todo-title { font-size: 14px; font-weight: 800; word-break: break-all; }
    .badge { font-size: 10px; font-weight: 900; padding: 2px 6px; border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 1px 1px 0px #000; }
    .badge-p1 { background: var(--accent-pink); color: #fff; }
    .badge-p2 { background: var(--accent-yellow); }
    .badge-p3 { background: var(--accent-blue); }
    .badge-cat { background: #e2e8f0; }
    .btn-action { background: var(--accent-pink); color: #fff; border: 1.5px solid var(--border-color); box-shadow: 1px 1px 0px #000; border-radius: 4px; padding: 2px 6px; font-weight: 900; cursor: pointer; font-size: 12px; }
    .empty-state { text-align: center; padding: 30px 0; font-weight: 800; font-size: 14px; }
    
    .login-prompt { text-align: center; padding: 40px 20px; font-weight: 800; font-size: 15px; background: #fff; border: 2px solid #000; box-shadow: var(--shadow-hard-sm); border-radius: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="neo-card">
    <div class="top-header">
      <div class="title-box" id="appTitle">
        <h1>⚡ 任務清單</h1>
      </div>
      
      <!-- 登入狀態控制 -->
      <div class="auth-section">
        <button id="loginBtn" class="btn-login" onclick="loginWithGoogle()">Google 登入</button>
        <div class="user-profile" id="userProfile">
          <img id="userAvatar" src="" alt="Avatar">
          <span id="userName">User</span>
          <button class="btn-logout" onclick="logout()">登出</button>
        </div>
      </div>
    </div>

    <!-- 未登入提示遮罩/區塊 -->
    <div id="loginPrompt" class="login-prompt">
      請先點擊右上角進行 Google 登入，以同步您的雲端待辦事項 ✨
    </div>

    <!-- 主要操作區（登入後解鎖） -->
    <div id="mainApp" style="display: none;">
      <div class="search-pill">
        🔍 <input type="text" id="searchInput" placeholder="搜尋任務名稱..." oninput="renderTodos()">
      </div>

      <div class="progress-box">
        <div class="progress-info">
          <span>完成進度</span>
          <span id="progressText">0% (0/0)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="tab-group">
        <button class="neo-tab active" onclick="setFilter('all', this)">全部</button>
        <button class="neo-tab" onclick="setFilter('工作', this)">💼 工作</button>
        <button class="neo-tab" onclick="setFilter('個人', this)">🏠 個人</button>
        <button class="neo-tab" onclick="setFilter('購物', this)">🛒 購物</button>
      </div>

      <div class="input-box">
        <input type="text" id="todoInput" class="neo-input" placeholder="新增待辦事項..." onkeydown="if(event.key==='Enter') addTodo()">
        <div class="input-options">
          <select id="categorySelect" class="neo-select">
            <option value="工作">💼 工作</option>
            <option value="個人">🏠 個人</option>
            <option value="購物">🛒 購物</option>
          </select>
          <select id="prioritySelect" class="neo-select">
            <option value="P3">🔵 低優先</option>
            <option value="P2">🟡 中優先</option>
            <option value="P1">🔴 高優先</option>
          </select>
          <input type="date" id="dateInput" class="neo-date">
          <button class="btn-add" onclick="addTodo()">+ 新增</button>
        </div>
      </div>

      <ul class="todo-list" id="todoList"></ul>

      <div class="empty-state" id="emptyState" style="display: none;">
        目前沒有任何任務 🌟
      </div>
    </div>
  </div>

  <!-- Firebase 雲端邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // 您的 Firebase 實際設定
    const firebaseConfig = {
      apiKey: "AIzaSyCMI_GPgct0PDibMt5itg4_InZ7TJDbLBI",
      authDomain: "neo-task-suite.firebaseapp.com",
      projectId: "neo-task-suite",
      storageBucket: "neo-task-suite.firebasestorage.app",
      messagingSenderId: "988363277791",
      appId: "1:988363277791:web:9dafd7da48d93fccfeb06a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let todos = [];
    let currentFilter = 'all';
    let unsubscribe = null;

    // 全域綁定登入函式
    window.loginWithGoogle = () => {
      signInWithPopup(auth, provider).catch(error => console.error("登入失敗", error));
    };

    window.logout = () => {
      signOut(auth);
    };

    // 監聽登入狀態
    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('loginPrompt').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';

        document.getElementById('userName').innerText = user.displayName || '使用者';
        document.getElementById('userAvatar').src = user.photoURL || '';
        document.getElementById('appTitle').innerHTML = `<h1>⚡ ${user.displayName ? user.displayName.split(' ')[0] : '我的'} 的清單</h1>`;

        // 即時同步該使用者的 Firestore 資料
        loadUserTodos(user.uid);
      } else {
        document.getElementById('loginBtn').style.display = 'block';
        document.getElementById('userProfile').style.display = 'none';
        document.getElementById('loginPrompt').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('appTitle').innerHTML = `<h1>⚡ 任務清單</h1>`;
        
        if (unsubscribe) unsubscribe();
      }
    });

    // 從 Firestore 讀取資料
    function loadUserTodos(uid) {
      const q = query(collection(db, "todos"), where("uid", "==", uid));
      unsubscribe = onSnapshot(q, snapshot => {
        todos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTodos();
      });
    }

    // 新增任務
    window.addTodo = async () => {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text || !auth.currentUser) return;

      await addDoc(collection(db, "todos"), {
        uid: auth.currentUser.uid,
        text: text,
        category: document.getElementById('categorySelect').value,
        priority: document.getElementById('prioritySelect').value,
        date: document.getElementById('dateInput').value,
        completed: false,
        createdAt: Date.now()
      });
      input.value = '';
    };

    // 切換完成狀態
    window.toggleTodo = async (id, currentStatus) => {
      const docRef = doc(db, "todos", id);
      await updateDoc(docRef, { completed: !currentStatus });
    };

    // 刪除任務
    window.deleteTodo = async (id) => {
      const docRef = doc(db, "todos", id);
      await deleteDoc(docRef);
    };

    window.setFilter = (filter, btn) => {
      currentFilter = filter;
      document.querySelectorAll('.neo-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTodos();
    };

    function renderTodos() {
      const todoList = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();
      todoList.innerHTML = '';

      let filtered = todos.filter(t => {
        const matchCat = (currentFilter === 'all') || (t.category === currentFilter);
        const matchSearch = t.text.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      const total = todos.length;
      const comp = todos.filter(t => t.completed).length;
      const pct = total === 0 ? 0 : Math.round((comp / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').innerText = `${pct}% (${comp}/${total})`;

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          const pLabel = todo.priority === 'P1' ? '高' : todo.priority === 'P2' ? '中' : '低';

          li.innerHTML = `
            <div class="todo-row">
              <div class="todo-left">
                <input type="checkbox" class="neo-cb" ${todo.completed ? 'checked' : ''} onclick="toggleTodo('${todo.id}', ${todo.completed})">
                <div>
                  <div class="todo-title">${escapeHtml(todo.text)}</div>
                  <div style="display:flex; gap:6px; margin-top:4px; align-items:center;">
                    <span class="badge badge-${todo.priority.toLowerCase()}">${pLabel}</span>
                    <span class="badge badge-cat">${todo.category}</span>
                    ${todo.date ? `<span style="font-size:10px; font-weight:800;">📅 ${todo.date}</span>` : ''}
                  </div>
                </div>
              </div>
              <button class="btn-action" onclick="deleteTodo('${todo.id}')">✕</button>
            </div>
          `;
          todoList.appendChild(li);
        });
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
