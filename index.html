<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo-Brutalism 雲端個人化待辦清單</title>
  
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk5lby1CcnV0YWxpc20gVG9kbyIsCiAgInNob3J0X25hbWUiOiAiTmVvVG9kbyIsCiAgInN0YXJ0X3VybCI6ICIvIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZjdmM2U5IiwKICAidGhlbWVfY29sb3IiOiAiI2ZkZTA0NyIKfQ==">
  <meta name="theme-color" content="#fde047">

  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #ffffff;
      --border-color: #000000;
      --shadow-hard: 5px 5px 0px #000000;
      --shadow-hard-sm: 3px 3px 0px #000000;
      --shadow-hard-lg: 8px 8px 0px #000000;
      
      --accent-yellow: #fde047;
      --accent-pink: #f43f5e;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --accent-blue: #38bdf8;
      
      --text-main: #000000;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #ffffff;
      --shadow-hard: 5px 5px 0px #ffffff;
      --shadow-hard-sm: 3px 3px 0px #ffffff;
      --shadow-hard-lg: 8px 8px 0px #ffffff;
      --text-main: #ffffff;
      --accent-yellow: #facc15;
      background-image: radial-gradient(#333 1px, transparent 1px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; color: var(--text-main); transition: background-color 0.2s; }

    .neo-card { width: 100%; max-width: 640px; background: var(--card-bg); border: 3px solid var(--border-color); box-shadow: var(--shadow-hard-lg); border-radius: 16px; padding: 28px; position: relative; }

    .offline-banner { display: none; background: #ef4444; color: #fff; text-align: center; font-size: 11px; font-weight: 900; padding: 4px; border-radius: 6px; margin-bottom: 12px; border: 1.5px solid var(--border-color); }
    .offline-banner.show { display: block; }

    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .title-box { background: var(--accent-yellow); color: #000; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 6px 14px; border-radius: 8px; transform: rotate(-1deg); }
    .title-box h1 { font-size: 20px; font-weight: 900; }

    .header-controls { display: flex; align-items: center; gap: 8px; }
    .btn-icon { background: var(--card-bg); color: var(--text-main); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 6px 10px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .btn-icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color); }

    .auth-section { display: flex; align-items: center; gap: 10px; }
    .btn-login { background: var(--accent-yellow); color: #000; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 8px 14px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .user-profile { display: none; align-items: center; gap: 8px; background: var(--card-bg); border: 2px solid var(--border-color); padding: 4px 10px; border-radius: 20px; box-shadow: 2px 2px 0px var(--border-color); }
    .user-profile img { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border-color); }
    .user-profile span { font-weight: 800; font-size: 12px; color: var(--text-main); }
    .btn-logout { background: var(--accent-pink); color: #fff; border: 1.5px solid var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; cursor: pointer; }

    .progress-box { background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 12px; margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 6px; }
    .progress-track { height: 16px; background: rgba(0,0,0,0.1); border: 2px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-green); transition: width 0.3s ease; }

    .search-pill { display: flex; align-items: center; background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
    .search-pill input { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 700; margin-left: 8px; background: transparent; color: var(--text-main); }
    
    .filter-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-group { display: flex; gap: 8px; overflow-x: auto; }
    .neo-tab { background: var(--card-bg); color: var(--text-main); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .neo-tab.active { background: var(--accent-purple); color: #fff; }
    
    .manage-tools { display: flex; gap: 6px; }
    .btn-tool { background: var(--card-bg); color: var(--text-main); border: 1.5px solid var(--border-color); box-shadow: 1px 1px 0px var(--border-color); border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer; }

    .input-box { background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard); border-radius: 12px; padding: 14px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
    .neo-input { border: 2px solid var(--border-color); padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; outline: none; background: transparent; color: var(--text-main); }
    .input-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .neo-select, .neo-date { border: 2px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; background: var(--card-bg); color: var(--text-main); outline: none; cursor: pointer; }
    .btn-add { margin-left: auto; background: var(--accent-pink); color: #fff; border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); padding: 8px 18px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }

    .todo-list { list-style: none; display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
    .todo-item { background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .todo-item.completed { opacity: 0.6; }
    .todo-item.completed .todo-title { text-decoration: line-through; }
    
    .todo-item.overdue { border-color: var(--accent-pink); }
    .badge-overdue { background: var(--accent-pink); color: #fff; font-weight: 900; }

    .todo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .todo-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .neo-cb { width: 18px; height: 18px; accent-color: #000; cursor: pointer; }
    .todo-title { font-size: 14px; font-weight: 800; word-break: break-all; }
    .badge { font-size: 10px; font-weight: 900; padding: 2px 6px; border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 1px 1px 0px var(--border-color); }
    .badge-p1 { background: var(--accent-pink); color: #fff; }
    .badge-p2 { background: var(--accent-yellow); color: #000; }
    .badge-p3 { background: var(--accent-blue); color: #000; }
    .badge-cat { background: rgba(150,150,150,0.2); }
    
    .btn-group { display: flex; gap: 4px; }
    .btn-action { background: var(--accent-pink); color: #fff; border: 1.5px solid var(--border-color); box-shadow: 1px 1px 0px var(--border-color); border-radius: 4px; padding: 2px 6px; font-weight: 900; cursor: pointer; font-size: 12px; }
    .btn-edit { background: var(--accent-yellow); color: #000; }

    .edit-box { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
    .edit-actions { display: flex; justify-content: flex-end; gap: 6px; }

    .empty-state { text-align: center; padding: 30px 0; font-weight: 800; font-size: 14px; }
    .login-prompt { text-align: center; padding: 40px 20px; font-weight: 800; font-size: 15px; background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: var(--shadow-hard-sm); border-radius: 10px; margin-top: 20px; }

    .toast-undo { position: fixed; bottom: 20px; right: 20px; background: var(--accent-yellow); color: #000; border: 2px solid #000; box-shadow: var(--shadow-hard-sm); padding: 10px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 12px; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 999; }
    .toast-undo.show { transform: translateY(0); opacity: 1; }
    .btn-undo-action { background: #000; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: 900; font-size: 12px; }

    @media (max-width: 480px) {
      body { padding: 16px 10px; }
      .neo-card { padding: 18px 14px; border-width: 2.5px; box-shadow: 4px 4px 0px var(--border-color); }
      .title-box h1 { font-size: 16px; }
      .btn-add { width: 100%; margin-left: 0; }
      .toast-undo { left: 10px; right: 10px; bottom: 10px; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="neo-card">
    <div class="offline-banner" id="offlineBanner">⚠️ 當前處於離線狀態，變更將在連線後自動同步</div>

    <div class="top-header">
      <div class="title-box" id="appTitle">
        <h1>⚡ 任務清單</h1>
      </div>
      
      <div class="header-controls">
        <button class="btn-icon" onclick="exportData()" title="匯出資料 JSON">📥</button>
        <button class="btn-icon" onclick="toggleDarkMode()" title="切換夜間模式">🌙</button>
        <div class="auth-section">
          <button id="loginBtn" class="btn-login" onclick="loginWithGoogle()">Google 登入</button>
          <div class="user-profile" id="userProfile">
            <img id="userAvatar" src="" alt="Avatar">
            <span id="userName">User</span>
            <button class="btn-logout" onclick="logout()">登出</button>
          </div>
        </div>
      </div>
    </div>

    <div id="loginPrompt" class="login-prompt">
      請先點擊右上角進行 Google 登入，以同步您的雲端待辦事項 ✨
    </div>

    <div id="mainApp" style="display: none;">
      <div class="search-pill">
        🔍 <input type="text" id="searchInput" placeholder="搜尋任務名稱..." oninput="renderTodos()">
      </div>

      <div class="progress-box">
        <div class="progress-info">
          <span>完成進度</span>
          <span id="progressText">0% (0/0)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="tab-group">
          <button class="neo-tab active" onclick="setFilter('all', this)">全部</button>
          <button class="neo-tab" onclick="setFilter('工作', this)">💼 工作</button>
          <button class="neo-tab" onclick="setFilter('個人', this)">🏠 個人</button>
          <button class="neo-tab" onclick="setFilter('購物', this)">🛒 購物</button>
        </div>
        <div class="manage-tools">
          <button class="btn-tool" id="toggleHideCompletedBtn" onclick="toggleHideCompleted()">👁️ 隱藏完成</button>
          <button class="btn-tool" onclick="clearCompletedTodos()">🗑️ 清除已完成</button>
        </div>
      </div>

      <div class="input-box">
        <input type="text" id="todoInput" class="neo-input" placeholder="新增待辦事項..." onkeydown="if(event.key==='Enter') addTodo()">
        <div class="input-options">
          <select id="categorySelect" class="neo-select">
            <option value="工作">💼 工作</option>
            <option value="個人">🏠 個人</option>
            <option value="購物">🛒 購物</option>
          </select>
          <select id="prioritySelect" class="neo-select">
            <option value="P3">🔵 低優先</option>
            <option value="P2">🟡 中優先</option>
            <option value="P1">🔴 高優先</option>
          </select>
          <input type="date" id="dateInput" class="neo-date">
          <button class="btn-add" onclick="addTodo()">+ 新增</button>
        </div>
      </div>

      <ul class="todo-list" id="todoList"></ul>

      <div class="empty-state" id="emptyState" style="display: none;">
        目前沒有任何任務 🌟
      </div>
    </div>
  </div>

  <div class="toast-undo" id="toastUndo">
    <span id="toastText">已刪除任務</span>
    <button class="btn-undo-action" onclick="undoLastAction()">復原 (Undo)</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, orderBy, limit, enableIndexedDbPersistence, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMI_GPgct0PDibMt5itg4_InZ7TJDbLBI",
      authDomain: "neo-task-suite.firebaseapp.com",
      projectId: "neo-task-suite",
      storageBucket: "neo-task-suite.firebasestorage.app",
      messagingSenderId: "988363277791",
      appId: "1:988363277791:web:9dafd7da48d93fccfeb06a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    enableIndexedDbPersistence(db).catch(err => {
      if (err.code === 'failed-precondition') console.log('多個分頁開啟，僅支援單一分頁離線快取');
    });

    let todos = [];
    let currentFilter = 'all';
    let hideCompleted = false;
    let editingId = null;
    let deletedCache = [];
    let toastTimer = null;
    let unsubscribe = null;

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    function updateOnlineStatus() {
      const banner = document.getElementById('offlineBanner');
      if (navigator.onLine) {
        banner.classList.remove('show');
      } else {
        banner.classList.add('show');
      }
    }

    window.toggleDarkMode = () => {
      document.body.classList.toggle('dark-mode');
    };

    window.exportData = () => {
      if (todos.length === 0) return alert('目前沒有任務可供匯出');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `neo_todos_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.toggleHideCompleted = () => {
      hideCompleted = !hideCompleted;
      document.getElementById('toggleHideCompletedBtn').innerText = hideCompleted ? '👁️ 顯示完成' : '👁️ 隱藏完成';
      renderTodos();
    };

    function showUndoToast(message, deletedItems) {
      deletedCache = deletedItems;
      const toast = document.getElementById('toastUndo');
      document.getElementById('toastText').innerText = message;
      toast.classList.add('show');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        deletedCache = [];
      }, 5000);
    }

    window.undoLastAction = async () => {
      if (deletedCache.length === 0 || !auth.currentUser) return;
      const batch = writeBatch(db);
      deletedCache.forEach(item => {
        const newRef = doc(collection(db, "todos"));
        const { id, ...data } = item;
        batch.set(newRef, data);
      });
      await batch.commit();
      document.getElementById('toastUndo').classList.remove('show');
      deletedCache = [];
    };

    window.clearCompletedTodos = async () => {
      const completedTodos = todos.filter(t => t.completed);
      if (completedTodos.length === 0) return;

      const batch = writeBatch(db);
      completedTodos.forEach(t => {
        batch.delete(doc(db, "todos", t.id));
      });
      await batch.commit();
      showUndoToast(`已清除 ${completedTodos.length} 個已完成任務`, completedTodos);
    };

    // 跨平台（iOS & Android）轉址登入
    window.loginWithGoogle = () => {
      signInWithRedirect(auth, provider);
    };

    window.logout = () => {
      signOut(auth);
    };

    // 接收跨平台轉址授權結果
    getRedirectResult(auth).catch(error => {
      if (error.code) console.error("轉址登入發生錯誤:", error);
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('loginPrompt').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';

        document.getElementById('userName').innerText = user.displayName || '使用者';
        document.getElementById('userAvatar').src = user.photoURL || '';
        document.getElementById('appTitle').innerHTML = `<h1>⚡ ${user.displayName ? user.displayName.split(' ')[0] : '我的'} 的清單</h1>`;

        loadUserTodos(user.uid);
      } else {
        document.getElementById('loginBtn').style.display = 'block';
        document.getElementById('userProfile').style.display = 'none';
        document.getElementById('loginPrompt').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('appTitle').innerHTML = `<h1>⚡ 任務清單</h1>`;
        
        if (unsubscribe) unsubscribe();
      }
    });

    function loadUserTodos(uid) {
      const q = query(
        collection(db, "todos"), 
        where("uid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(200)
      );
      
      unsubscribe = onSnapshot(q, snapshot => {
        todos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTodos();
      });
    }

    window.addTodo = async () => {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text || !auth.currentUser) return;

      await addDoc(collection(db, "todos"), {
        uid: auth.currentUser.uid,
        text: text,
        category: document.getElementById('categorySelect').value,
        priority: document.getElementById('prioritySelect').value,
        date: document.getElementById('dateInput').value,
        completed: false,
        createdAt: Date.now()
      });
      input.value = '';
    };

    window.toggleTodo = async (id, currentStatus) => {
      const docRef = doc(db, "todos", id);
      await updateDoc(docRef, { completed: !currentStatus });
    };

    window.deleteTodo = async (id) => {
      const target = todos.find(t => t.id === id);
      if (!target) return;
      const docRef = doc(db, "todos", id);
      await deleteDoc(docRef);
      showUndoToast('已刪除任務', [target]);
    };

    window.startEdit = (id) => {
      editingId = id;
      renderTodos();
    };

    window.cancelEdit = () => {
      editingId = null;
      renderTodos();
    };

    window.saveEdit = async (id) => {
      const newText = document.getElementById(`edit-text-${id}`).value.trim();
      if (!newText) return alert('任務內容不能空白');

      const newCat = document.getElementById(`edit-cat-${id}`).value;
      const newPri = document.getElementById(`edit-pri-${id}`).value;
      const newDate = document.getElementById(`edit-date-${id}`).value;

      const docRef = doc(db, "todos", id);
      await updateDoc(docRef, {
        text: newText,
        category: newCat,
        priority: newPri,
        date: newDate
      });

      editingId = null;
    };

    window.setFilter = (filter, btn) => {
      currentFilter = filter;
      document.querySelectorAll('.neo-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTodos();
    };

    function renderTodos() {
      const todoList = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      todoList.innerHTML = '';

      const todayStr = new Date().toISOString().slice(0,10);

      let filtered = todos.filter(t => {
        const matchCat = (currentFilter === 'all') || (t.category === currentFilter);
        const matchSearch = t.text.toLowerCase().includes(search);
        const matchHide = hideCompleted ? !t.completed : true;
        return matchCat && matchSearch && matchHide;
      });

      const total = todos.length;
      const comp = todos.filter(t => t.completed).length;
      const pct = total === 0 ? 0 : Math.round((comp / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').innerText = `${pct}% (${comp}/${total})`;

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filtered.forEach(todo => {
          const li = document.createElement('li');
          const isOverdue = todo.date && todo.date < todayStr && !todo.completed;
          
          li.className = `todo-item ${todo.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;
          const pLabel = todo.priority === 'P1' ? '高' : todo.priority === 'P2' ? '中' : '低';

          if (editingId === todo.id) {
            li.innerHTML = `
              <div class="edit-box">
                <input type="text" id="edit-text-${todo.id}" class="neo-input" value="${escapeHtml(todo.text)}">
                <div class="input-options">
                  <select id="edit-cat-${todo.id}" class="neo-select">
                    <option value="工作" ${todo.category === '工作' ? 'selected' : ''}>💼 工作</option>
                    <option value="個人" ${todo.category === '個人' ? 'selected' : ''}>🏠 個人</option>
                    <option value="購物" ${todo.category === '購物' ? 'selected' : ''}>🛒 購物</option>
                  </select>
                  <select id="edit-pri-${todo.id}" class="neo-select">
                    <option value="P3" ${todo.priority === 'P3' ? 'selected' : ''}>🔵 低優先</option>
                    <option value="P2" ${todo.priority === 'P2' ? 'selected' : ''}>🟡 中優先</option>
                    <option value="P1" ${todo.priority === 'P1' ? 'selected' : ''}>🔴 高優先</option>
                  </select>
                  <input type="date" id="edit-date-${todo.id}" class="neo-date" value="${todo.date || ''}">
                </div>
                <div class="edit-actions">
                  <button class="btn-tool" onclick="cancelEdit()">取消</button>
                  <button class="btn-action" style="background:var(--accent-green); color:#000;" onclick="saveEdit('${todo.id}')">儲存</button>
                </div>
              </div>
            `;
          } else {
            li.innerHTML = `
              <div class="todo-row">
                <div class="todo-left">
                  <input type="checkbox" class="neo-cb" ${todo.completed ? 'checked' : ''} onclick="toggleTodo('${todo.id}', ${todo.completed})">
                  <div>
                    <div class="todo-title">${escapeHtml(todo.text)}</div>
                    <div style="display:flex; gap:6px; margin-top:4px; align-items:center; flex-wrap:wrap;">
                      <span class="badge badge-${todo.priority.toLowerCase()}">${pLabel}</span>
                      <span class="badge badge-cat">${todo.category}</span>
                      ${todo.date ? `<span class="badge ${isOverdue ? 'badge-overdue' : ''}">${isOverdue ? '⚠️ 逾期 ' : '📅 '}${todo.date}</span>` : ''}
                    </div>
                  </div>
                </div>
                <div class="btn-group">
                  <button class="btn-action btn-edit" onclick="startEdit('${todo.id}')">✏️</button>
                  <button class="btn-action" onclick="deleteTodo('${todo.id}')">✕</button>
                </div>
              </div>
            `;
          }
          todoList.appendChild(li);
        });
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }

    updateOnlineStatus();
  </script>
</body>
</html>
